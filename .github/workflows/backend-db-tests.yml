name: Backend DB Tests

on:
  pull_request:
    paths:
      - "backend/director/db/**"
      - "backend/tests/db/**"
      - ".github/workflows/backend-db-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/director/db/**"
      - "backend/tests/db/**"
      - ".github/workflows/backend-db-tests.yml"

permissions:
  contents: read

jobs:
  session-delete-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest==8.3.2 python-dotenv==1.0.1

      - name: Run DB contract tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/db/test_session_delete_contract.py

name: Backend Contract Tests

on:
  pull_request:
    paths:
      - "backend/director/db/**"
      - "backend/director/core/reasoning.py"
      - "backend/tests/db/**"
      - "backend/tests/core/**"
      - ".github/workflows/backend-db-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/director/db/**"
      - "backend/director/core/reasoning.py"
      - "backend/tests/db/**"
      - "backend/tests/core/**"
      - ".github/workflows/backend-db-tests.yml"

permissions:
  contents: read

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest==8.3.2

      - name: Run backend contract tests
        env:
          PYTHONPATH: backend
        run: >-
          pytest -q
          backend/tests/db/test_session_delete_contract.py
          backend/tests/core/test_reasoning_outcome_contract.py
